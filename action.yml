name: "AI Code Review Agent"
description: "Automated repository-aware AI code reviews for GitHub pull requests"

branding:
  icon: "code"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token"
    required: true

  openai-api-key:
    description: "OpenAI API key"
    required: true

runs:
  using: "docker"
  image: "Dockerfile"