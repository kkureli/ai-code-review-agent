name: "AI Code Review Agent"
description: "Automated repository-aware AI code reviews for GitHub pull requests"

branding:
  icon: "code"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token with pull-requests: write"
    required: true

  openai-api-key:
    description: "OpenAI API key (BYOK)"
    required: true

  model:
    description: "OpenAI model for structured review"
    required: false
    default: "gpt-5-mini"

  min-confidence:
    description: "Minimum finding confidence to publish (0-1)"
    required: false
    default: "0.75"

  max-comments:
    description: "Maximum inline review comments"
    required: false
    default: "10"

  min-severity:
    description: "Minimum severity to publish: low, medium, or high"
    required: false
    default: "medium"

runs:
  using: "docker"
  image: "Dockerfile"
